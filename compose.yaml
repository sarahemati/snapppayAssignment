version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data


  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      LOG_PATH: /opt/app/logs
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wallet
      SPRING_DATASOURCE_USERNAME: wallet
      SPRING_DATASOURCE_PASSWORD: wallet
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      # JWT
      APP_JWT_SECRET: "VGhpc0lzQURldkRTZWNyZXQxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMw=="
      APP.JWT.EXP: "7200"
    volumes:
      - ./logs:/opt/app/logs
    ports:
      - "8080:8080"
volumes:
  pgdata:
